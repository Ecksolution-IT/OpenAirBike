<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spike: SQLite in OPFS</title>
  </head>
  <body style="font-family: system-ui; background: #111; color: #eee">
    <h1>Spike: SQLite WASM + OPFS (opfs-sahpool, no COOP/COEP)</h1>
    <pre id="out">running…</pre>
    <script type="module">
      const out = document.getElementById('out');
      const worker = new Worker(new URL('./worker.ts', import.meta.url), { type: 'module' });
      worker.onmessage = (e) => {
        out.textContent = JSON.stringify(e.data, null, 2);
        window.spikeResult = e.data;
      };
      worker.onerror = (e) => {
        out.textContent = 'worker error: ' + e.message;
        window.spikeResult = { ok: false, error: e.message };
      };
    </script>
  </body>
</html>
